name: Deploy to GitHub Pages

# Builds the static version of the store (NEXT_PUBLIC_DATA_SOURCE=static:
# catalog from data/catalog.json, no database or server) and publishes it to
# https://divyagopalnadar.github.io/aurel-studio/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Static build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_SOURCE: static
      PAGES_BASE_PATH: /aurel-studio
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only needed so the Prisma-backed files typecheck; the static build
      # never connects to a database.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
