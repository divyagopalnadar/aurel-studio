name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Database build (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      # Throwaway SQLite database (resolved relative to prisma/schema.prisma).
      DATABASE_URL: file:./ci.db
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The home page and product pages are prerendered from the database at
      # build time, so the schema and seed data must exist before `next build`.
      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npm run build
